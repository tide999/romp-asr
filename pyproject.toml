[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "romp-asr"
version = "0.2.0"
description = "Typed safety policy DSL and trusted tool execution for agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
dev = ["pytest>=8.4"]

[project.scripts]
romp-agentos = "romp_asr.cli:main"
romp-agent = "romp_asr.reference_agent:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["romp_asr*"]
